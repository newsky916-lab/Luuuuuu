<title>福岡行旅帳</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Mali:wght@500;600&family=LXGW+WenKai+TC:wght@400&display=swap">
<style>
/* Layout: style L "夕陽玻璃" — a fixed Hakata-bay sunset sky behind frosted-glass cards, marker-pen type, pill controls, fixed bottom tab bar, bottom sheets. Dark = dusk over the bay. */
:root{
  --sky:linear-gradient(170deg,#ffb08a 0%,#f8cf96 30%,#c4d2e6 68%,#93acd3 100%);
  --bg:#c4d2e6; --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.75);
  --ink:#1e2340; --muted:#434b6c; --line:rgba(30,35,64,.14);
  --accent:#1e2340; --on-accent:#ffffff; --sun:#ff8a5c; --sun-ink:#b5441c; --sun-soft:rgba(255,138,92,.3);
  --ok:#1f7a5a; --scrim:rgba(30,35,64,.35); --shadow:0 8px 24px rgba(30,35,64,.12);
  --tp:rgba(255,255,255,.7); --tp2:rgba(255,214,170,.85); --tp3:rgba(196,210,230,.95);
  --snail:#fff3d6; --shell:#ff8a5c; --blush:#ff9f8f;
  --wave1:rgba(255,255,255,.38); --wave2:rgba(84,124,186,.28); --wave3:rgba(255,255,255,.55);
  --f-hand:"Yusei Magic","LXGW WenKai TC","PingFang TC",sans-serif;
  --f-num:"Mali","Yusei Magic",sans-serif;
  --f-latin:"Yusei Magic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:linear-gradient(170deg,#1f1d3d 0%,#3b2d5a 42%,#74435f 80%,#9a535a 100%);
  --bg:#3b2d5a; --glass:rgba(22,20,44,.42); --glass-strong:rgba(34,30,62,.86); --glass-line:rgba(255,255,255,.2);
  --ink:#f6f0ea; --muted:#d2c9dc; --line:rgba(255,255,255,.14);
  --accent:#ffd7b5; --on-accent:#1f1d3d; --sun:#ffa27a; --sun-ink:#ffb594; --sun-soft:rgba(255,162,122,.3);
  --ok:#8fe0bd; --scrim:rgba(0,0,0,.5); --shadow:0 8px 24px rgba(0,0,0,.25);
  --tp:rgba(255,255,255,.28); --tp2:rgba(255,190,150,.45); --tp3:rgba(180,170,230,.45);
  --snail:#ffe7c2; --shell:#ffa27a; --blush:#ff9f8f; --wave1:rgba(255,255,255,.07); --wave2:rgba(255,170,140,.14); --wave3:rgba(255,200,170,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:linear-gradient(170deg,#1f1d3d 0%,#3b2d5a 42%,#74435f 80%,#9a535a 100%);
  --bg:#3b2d5a; --glass:rgba(22,20,44,.42); --glass-strong:rgba(34,30,62,.86); --glass-line:rgba(255,255,255,.2);
  --ink:#f6f0ea; --muted:#d2c9dc; --line:rgba(255,255,255,.14);
  --accent:#ffd7b5; --on-accent:#1f1d3d; --sun:#ffa27a; --sun-ink:#ffb594; --sun-soft:rgba(255,162,122,.3);
  --ok:#8fe0bd; --scrim:rgba(0,0,0,.5); --shadow:0 8px 24px rgba(0,0,0,.25);
  --tp:rgba(255,255,255,.28); --tp2:rgba(255,190,150,.45); --tp3:rgba(180,170,230,.45);
  --snail:#ffe7c2; --shell:#ffa27a; --blush:#ff9f8f; --wave1:rgba(255,255,255,.07); --wave2:rgba(255,170,140,.14); --wave3:rgba(255,200,170,.22); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-hand);font-size:16px;line-height:1.65;margin:0;font-synthesis:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--sky)}
b,strong,h1,h2,h3{font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun-ink);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* frosted glass card */
.sketch{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow)}
.tape{position:relative}
.wt,.tape::before{content:"";position:absolute;top:-8px;left:50%;width:50px;height:15px;transform:translateX(-50%) rotate(-2deg);pointer-events:none;background:var(--tp);
  clip-path:polygon(0 0,100% 0,96% 25%,100% 50%,96% 75%,100% 100%,0 100%,4% 75%,0 50%,4% 25%)}
.tape.t2::before{background:var(--tp3);transform:translateX(-50%) rotate(2deg)}
.tape.t4::before{background:var(--tp2)}

/* header */
header.top{padding-block:20px 6px;display:grid;gap:16px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.eyebrow{font-family:var(--f-latin);color:var(--sun-ink);font-size:.82rem;letter-spacing:.14em;margin:0;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.spark{width:18px;height:18px;flex:0 0 auto}
.spark path{stroke:var(--sun-ink);stroke-width:2.6;stroke-linecap:round;fill:none}
h1{font-size:2rem;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.doodle{width:118px;height:96px;max-width:100%;overflow:visible}
.doodle .blob{fill:#fff3d6;filter:drop-shadow(0 0 10px rgba(255,243,214,.9))}
.doodle .blob2{fill:var(--glass-strong);opacity:.6}
.doodle .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{justify-self:start;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:4px 16px;font-size:.9rem;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 8px 10px;min-width:0;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-weight:600;font-size:1.25rem;line-height:1.2;white-space:nowrap}
.stat b small{display:block;font-size:.8rem;color:var(--muted)}
.stat span{font-size:.78rem;color:var(--muted)}

h2{font-size:1.3rem;margin:28px 0 10px;display:inline-flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.panel[hidden]{display:none}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding-block:6px 10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.day{flex:0 0 auto;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:5px 14px;text-align:center;line-height:1.2;font-family:var(--f-num);font-size:1rem}
.day small{display:block;font-family:var(--f-hand);font-size:.7rem;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.day[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}

/* timeline */
.timeline{list-style:none;margin:10px 0 0 58px;padding:0;border-left:2px solid var(--glass-line)}
.stop{position:relative;padding:4px 0 18px 20px}
.stop::before{content:"";position:absolute;left:-8px;top:13px;width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.stop time{position:absolute;left:-66px;top:6px;width:54px;text-align:right;font-family:var(--f-num);font-size:1.05rem;color:var(--ink)}
.stop button.card{display:block;width:100%;text-align:left;padding:12px 14px}
.stop .t{font-size:1.05rem}
.stop .meta{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.stop .map{display:inline-block;margin-top:6px;font-size:.85rem;color:var(--ink);text-decoration:none;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:1px 12px}
.map-hint{font-size:.78rem;color:var(--ok);min-height:1em}
.tag{display:inline-block;font-size:.7rem;padding:0 8px;border-radius:999px;background:var(--line);color:var(--muted);vertical-align:2px;margin-left:6px}

.empty{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px dashed var(--glass-line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);margin-top:10px}
.loading{display:inline-flex;align-items:center;gap:8px}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:9px 20px;box-shadow:var(--shadow)}
.primary:active{transform:translateY(1px)}
.ghost{background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:8px 18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add-row{margin-top:18px}

/* lists */
.bar{height:10px;border-radius:999px;overflow:hidden;background:var(--glass);border:1px solid var(--glass-line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ffc48a);border-radius:999px;transition:width .3s}
.todo-form{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;margin-top:16px}
.todo-form select,.todo-form input{border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:7px 12px;min-width:0}
.group h3{font-size:1.05rem;margin:22px 0 8px}
.group h3 .num{color:var(--sun-ink);margin-left:6px}
.todos{list-style:none;margin:0;padding:4px}
.todos li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line)}
.todos li:first-child{border-top:0}
.todos label{flex:1;display:flex;gap:12px;align-items:flex-start;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.todos input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:22px;height:22px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:50%;background:var(--glass-strong);position:relative;cursor:pointer}
.todos input[type=checkbox]:checked{background:var(--sun);border-color:var(--sun)}
.todos input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.todos li.done label span.txt{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;padding:0 6px;line-height:1}
.mini{border:1px solid var(--glass-line);background:var(--glass-strong);border-radius:999px;font-size:.78rem;padding:2px 10px;white-space:nowrap}

/* money */
.cats{display:grid;gap:10px;margin-top:6px}
.cat{display:grid;grid-template-columns:4em minmax(0,1fr) auto;gap:10px;align-items:center}
.settle{list-style:none;padding:12px 14px;margin:0;display:grid;gap:8px}
.settle li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.settle .verdict{margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.pos{color:var(--ok)} .neg{color:var(--sun-ink)}
.ledger{list-style:none;margin:0;padding:4px}
.ledger li{border-top:1px solid var(--line)}
.ledger li:first-child{border-top:0}
.ledger button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;width:100%;padding:10px 12px;cursor:pointer}
.ledger button:focus-visible{outline:2px solid var(--sun-ink);outline-offset:-2px;border-radius:14px}
.ledger .desc{min-width:0;overflow-wrap:anywhere}
.ledger .amt{text-align:right;font-family:var(--f-num);font-weight:600;font-size:1.1rem;line-height:1.3}
.ledger .sm{font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;padding:0 9px;border-radius:999px;background:var(--sun-soft);margin-right:6px}
.pill.xfer{background:var(--tp3)}
.dayhead{font-size:.92rem;color:var(--muted);margin:18px 0 8px}

/* tab bar */
nav.tabs{position:fixed;overflow:visible;left:0;right:0;bottom:0;background:var(--glass-strong);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--glass-line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;z-index:5}
nav.tabs button{flex:1;max-width:180px;border:0;background:none;border-radius:999px;padding:5px;color:var(--muted)}
nav.tabs button span{display:block;font-size:1.08rem}
nav.tabs button small{font-family:var(--f-latin);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
nav.tabs button[aria-selected="true"]{color:var(--on-accent);background:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);width:100%;max-width:560px;border:1px solid var(--glass-line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;display:grid;gap:14px}
.sheet h3{font-size:1.25rem;margin:0}
.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:8px 12px;font-size:1.02rem;color:var(--ink);width:100%;min-width:0}
.field select option{background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips button{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:3px 14px;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.danger{background:none;border:1px solid var(--sun-ink);color:var(--sun-ink);border-radius:999px;padding:8px 16px}
.danger.armed{background:var(--sun-ink);color:#fff}

/* sea: soft waves along the bottom of the sky */
.sea{position:fixed;left:0;right:0;bottom:0;height:230px;z-index:-1;pointer-events:none;overflow:hidden}
.sea svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.sea .w1{fill:var(--wave1);animation:drift 26s linear infinite}
.sea .w2{fill:var(--wave2);animation:drift 38s linear infinite reverse}
.sea .w3{fill:none;stroke:var(--wave3);stroke-width:1.5;stroke-dasharray:2 10;stroke-linecap:round;animation:drift 30s linear infinite}
@keyframes drift{to{transform:translateX(-50%)}}
.wave-rule{display:block;width:72px;height:8px;margin:-4px 0 8px 18px}
.wave-rule path{fill:none;stroke:var(--sun);stroke-width:2;stroke-linecap:round;opacity:.7}

/* snail */
.mascot{display:block;width:64px;height:64px;overflow:visible}
.hero-art{position:relative;width:132px;height:100px;margin-top:14px}
.hero-art .doodle{position:absolute;right:0;top:0}
.hero-art .mascot{position:absolute;left:-14px;bottom:-6px;width:62px;height:62px;animation:bob 3s ease-in-out infinite}
.bubble{position:absolute;left:4px;top:-20px;background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:14px 14px 14px 4px;padding:0 10px;font-size:.78rem;white-space:nowrap;box-shadow:var(--shadow)}
@keyframes bob{50%{transform:translateX(4px)}}
.empty .mascot{margin:0 auto 6px;width:72px;height:72px}
.loading .mascot{width:44px;height:44px;animation:bob 1.6s ease-in-out infinite}
.peek{position:absolute;left:8px;top:-30px;width:42px;height:42px;clip-path:inset(0 0 24% 0)}
.verdict .mascot{display:inline-block;width:36px;height:36px;vertical-align:middle}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:7px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.note{font-size:.85rem;color:var(--muted);margin-top:32px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<div class="sea" aria-hidden="true"><svg viewBox="0 0 1440 150" preserveAspectRatio="none">
  <path class="w2" d="M0 70 C 70 52 120 52 180 70 S 300 88 360 70 S 480 52 540 70 S 660 88 720 70 S 840 52 900 70 S 1020 88 1080 70 S 1200 52 1260 70 S 1380 88 1440 70 V150 H0Z"/>
  <path class="w1" d="M0 96 C 96 82 120 82 180 96 S 300 110 360 96 S 480 82 540 96 S 660 110 720 96 S 840 82 900 96 S 1020 110 1080 96 S 1200 82 1260 96 S 1380 110 1440 96 V150 H0Z"/>
  <path class="w3" d="M0 125 C 90 115 180 115 270 125 S 450 135 540 125 S 720 115 810 125 S 990 135 1080 125 S 1260 115 1440 125"/>
</svg></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="snail" viewBox="0 0 100 100">
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path fill="none" d="M85 42 81 24M90 42l5-16"/>
    <path style="fill:var(--snail)" d="M6 88c0-7 10-9 22-9h46c6 0 9-6 9-15V46c0-8 10-8 10 0v24c0 14-8 20-20 20H12c-4 0-6-1-6-2z"/>
    <circle style="fill:var(--shell)" cx="50" cy="56" r="25"/>
    <path fill="none" d="M51 57c3-1 5 1 4 4s-6 4-9 1-1-10 5-11 12 4 11 11-9 12-16 10-12-10-9-18 12-13 20-11"/>
    <path fill="none" d="M86 59q3 2.5 6 0"/>
  </g>
  <circle fill="currentColor" cx="81" cy="23" r="3.6"/><circle fill="currentColor" cx="95.5" cy="25" r="3.6"/>
  <ellipse style="fill:var(--blush)" cx="93" cy="53" rx="3" ry="2"/>
</symbol></defs></svg>
  <header class="top">
    <div class="hero">
      <div>
        <p class="eyebrow"><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.4 6-.3 12 .2 19M2.5 12.3c6-.4 12 .3 19-.2M5.2 5c4.3 4.6 9 9.3 13.7 14M18.8 5.2C14.3 9.6 9.8 14.2 5 18.9"/></svg>Hakata Bay · Fukuoka</p>
        <h1 id="tripName">福岡行</h1>
        <p class="sub" id="tripDates">博多・天神・太宰府</p>
      </div>
      <div class="hero-art" aria-hidden="true">
      <span class="bubble">一起去看海～</span>
      <svg class="doodle" viewBox="0 0 120 96">
        <path class="blob" d="M84 12c11 0 19 8 18 19s-9 18-19 17-18-8-17-18 7-18 18-18z"/>
        <path class="blob2" d="M4 80c10-14 30-20 48-12s30 4 40 10c-8 10-80 12-88 2z"/>
        <path class="ln" d="M38 84 46 14 54 84M41 62h10M43 40h6M46 14V5M58 54q3-3 6 0q3-3 6 0M68 44q2.5-2.5 5 0q2.5-2.5 5 0M10 89c6-4 12-4 18 0s12 4 18 0 12-4 18 0 12 4 18 0 12-4 18 0"/>
      </svg>
      <svg class="mascot" style="color:var(--ink)"><use href="#snail"/></svg>
      </div>
    </div>
    <button class="icon-btn" id="openSettings" type="button">旅程設定 ✎</button>
    <div class="stats">
      <div class="stat sketch tape"><span id="cdLabel">出發倒數</span><b id="cdVal">—</b></div>
      <div class="stat sketch tape t4"><span>清單完成</span><b id="todoStat">0/0</b></div>
      <div class="stat sketch tape t2"><span>已花費</span><b id="spendStat">NT$0</b></div>
    </div>
  </header>

  <section class="panel" id="panel-plan">
    <h2>每日行程</h2>
    <svg class="wave-rule" viewBox="0 0 72 8" aria-hidden="true"><path d="M2 4c6-4 10-4 16 0s10 4 16 0 10-4 16 0 10 4 16 0"/></svg>
    <div class="days" id="days" role="group" aria-label="選擇日期"></div>
    <div id="planList"></div>
    <div class="row add-row"><button class="primary" type="button" id="addPlan">＋ 新增行程</button></div>
  </section>

  <section class="panel" id="panel-todo" hidden>
    <h2>清單 &amp; 口袋名單</h2>
    <svg class="wave-rule" viewBox="0 0 72 8" aria-hidden="true"><path d="M2 4c6-4 10-4 16 0s10 4 16 0 10-4 16 0 10 4 16 0"/></svg>
    <div class="bar" aria-hidden="true"><i id="todoBar" style="width:0"></i></div>
    <form class="todo-form" id="todoForm">
      <select id="todoGroup" aria-label="分類"></select>
      <input id="todoText" placeholder="寫下要做的事或想去的地方…" aria-label="項目" autocomplete="off">
      <button class="primary" type="submit">加入</button>
    </form>
    <div id="todoList"></div>
  </section>

  <section class="panel" id="panel-money" hidden>
    <h2>記帳本</h2>
    <svg class="wave-rule" viewBox="0 0 72 8" aria-hidden="true"><path d="M2 4c6-4 10-4 16 0s10 4 16 0 10-4 16 0 10 4 16 0"/></svg>
    <div class="stats" id="moneyStats"></div>
    <div class="row add-row"><button class="primary" type="button" id="addExp">＋ 記一筆</button></div>
    <div id="moneyBody"></div>
  </section>

  <p class="note" id="modeNote"></p>
</div>

<nav class="tabs" role="tablist">
  <svg class="mascot peek" style="color:var(--ink)" aria-hidden="true"><use href="#snail"/></svg>
  <button role="tab" aria-selected="true" data-tab="plan" type="button"><span>行程</span><small>plan</small></button>
  <button role="tab" aria-selected="false" data-tab="todo" type="button"><span>清單</span><small>list</small></button>
  <button role="tab" aria-selected="false" data-tab="money" type="button"><span>記帳</span><small>money</small></button>
</nav>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true"></form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const DEFAULT_SETTINGS = { name:"福岡行", start:"", days:4, rate:0.2469, travelers:["我","旅伴"] };
const TODO_GROUPS = ["出發前","行李","當地"];
const WISH_GROUPS = ["景點","逛街","美食","伴手禮"];
const GROUPS = [...TODO_GROUPS, ...WISH_GROUPS];
const CATS = ["機票","住宿","餐飲","交通","購物","門票","其他","轉帳"];
const XFER = "轉帳";
const WEEK = "日一二三四五六";
const LS_KEY = "fukuoka-trip-v1";
const SPARK = '<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.4 6-.3 12 .2 19M2.5 12.3c6-.4 12 .3 19-.2M5.2 5c4.3 4.6 9 9.3 13.7 14M18.8 5.2C14.3 9.6 9.8 14.2 5 18.9"/></svg>';
const SNAIL = '<svg class="mascot" style="color:var(--ink)" aria-hidden="true"><use href="#snail"/></svg>';
const LOADING = `<div class="empty"><span class="loading">${SNAIL}小蝸牛慢慢翻筆記本…</span></div>`;

// Local-only fallback content (used when the page runs outside the shared store)
const LOCAL_SAMPLE = {
  plans:[
    {day:1,time:"14:00",title:"抵達福岡機場",place:"福岡空港 国際線",note:"搭地鐵空港線到博多約 5 分鐘",sample:true}
  ],
  todos:[
    {group:"出發前",text:"確認護照效期",done:false,sample:true},
    {group:"美食",text:"中洲屋台",done:false,sample:true}
  ],
  expenses:[
    {amount:260,currency:"JPY",cat:"交通",payer:"我",day:1,note:"機場→博多 地鐵",sample:true}
  ]
};

const state = { plans:[], todos:[], expenses:[], settings:{...DEFAULT_SETTINGS}, tab:"plan", day:1, mode:"loading" };
let db = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const fmt = n => Math.round(n).toLocaleString("en-US");
const yen = n => "¥" + fmt(n);
const twd = n => "NT$" + fmt(n);

// ---------- store ----------
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify({plans:state.plans,todos:state.todos,expenses:state.expenses,settings:state.settings})); } catch {} }
function startLocal(){
  state.mode = "local";
  const saved = lsLoad();
  if (saved) Object.assign(state, {plans:saved.plans||[],todos:saved.todos||[],expenses:saved.expenses||[],settings:{...DEFAULT_SETTINGS,...saved.settings}});
  else { for (const k of ["plans","todos","expenses"]) state[k] = LOCAL_SAMPLE[k].map((x,i) => ({id:uid(),created:Date.now()+i,...x})); lsSave(); }
  render();
}
// ---- Google Sheets: page served by the sheet's own Apps Script web app ----
const GAS = (typeof google !== "undefined" && google.script && google.script.run) ? google.script.run : null;
const api = GAS, CACHE_KEY = LS_KEY + "-sheet-cache";
let pending = 0, shareLink = "";
function applyAll(j){
  state.plans = j.plans || []; state.todos = j.todos || []; state.expenses = j.expenses || [];
  state.settings = {...DEFAULT_SETTINGS, ...(j.settings || {})};
  shareLink = j.url || shareLink;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(j)); } catch {}
  render();
}
function gas(body){ return new Promise((res, rej) => GAS.withSuccessHandler(res).withFailureHandler(rej).api(body || null)); }
async function pull(){
  if (pending) return;
  try { const j = await gas(); if (!pending) applyAll(j); }
  catch { toast("暫時連不上 Google 試算表"); }
}
async function push(body){
  pending++; render();
  try { const j = await gas(body); pending--; if (!pending) applyAll(j); }
  catch { pending--; toast("同步失敗，請檢查網路後再試一次"); pull(); }
}
function startSheet(){
  state.mode = "sheet";
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (c) applyAll(c); } catch {}
  render(); pull();
  setInterval(() => { if (!document.hidden) pull(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
}

function startDb(){
  state.mode = "db";
  for (const coll of ["plans","todos","expenses"]) {
    db.collection(coll).onSnapshot(snap => {
      state[coll] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      render();
    }, e => toast("同步中斷：" + e.message));
  }
  db.doc("settings/trip").onSnapshot(snap => {
    state.settings = {...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {})};
    render();
  }, () => {});
  render();
}
function failMsg(e){
  if (e && e.code === "invalid_argument") return "你只有檢視權限，無法修改";
  if (e && e.code === "quota_exceeded") return "資料已達上限，請刪除一些項目";
  return "儲存失敗，請再試一次";
}
async function addItem(coll, data){
  data = {...data, created: Date.now()};
  if (api) { const item = {id:uid(), ...data}; state[coll].push(item); render(); return push({op:"upsert", coll, item}); }
  if (db) { try { await db.collection(coll).add(data); } catch(e){ toast(failMsg(e)); } return; }
  state[coll].push({id:uid(), ...data}); lsSave(); render();
}
async function updItem(coll, id, patch){
  if (api) { const it = state[coll].find(x => x.id === id); if (!it) return; Object.assign(it, patch); render(); return push({op:"upsert", coll, item:{...it}}); }
  if (db) { try { await db.collection(coll).doc(id).update(patch); } catch(e){ toast(failMsg(e)); } return; }
  const it = state[coll].find(x => x.id === id); if (it) Object.assign(it, patch); lsSave(); render();
}
async function delItem(coll, id){
  if (api) { state[coll] = state[coll].filter(x => x.id !== id); render(); return push({op:"delete", coll, id}); }
  if (db) { try { await db.collection(coll).doc(id).delete(); } catch(e){ toast(failMsg(e)); } return; }
  state[coll] = state[coll].filter(x => x.id !== id); lsSave(); render();
}
async function saveSettings(s){
  if (api) { state.settings = {...DEFAULT_SETTINGS, ...s}; render(); return push({op:"settings", settings:s}); }
  if (db) { try { await db.doc("settings/trip").set(s); } catch(e){ toast(failMsg(e)); } return; }
  state.settings = s; lsSave(); render();
}

// ---------- helpers ----------
function numDays(){ return Math.max(1, Math.min(30, Number(state.settings.days)||4)); }
function dayDate(n){
  const s = state.settings.start; if (!s) return null;
  const d = new Date(s + "T00:00:00"); if (isNaN(d)) return null;
  d.setDate(d.getDate() + n - 1); return d;
}
function dayLabel(n){
  const d = dayDate(n);
  return d ? `${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）` : "";
}
function rate(){ return Number(state.settings.rate) || DEFAULT_SETTINGS.rate; } // TWD per 1 JPY
function toJPY(e){ return e.currency === "TWD" ? e.amount / rate() : e.amount; }
function both(jpy){ return `${twd(jpy * rate())}<small>${yen(jpy)}</small>`; }
function native(e){ return e.currency === "TWD" ? twd(e.amount) : yen(e.amount); }
function other(e){ return e.currency === "TWD" ? "≈ " + yen(toJPY(e)) : "≈ " + twd(e.amount * rate()); }
function travelers(){ const t = (state.settings.travelers||[]).filter(Boolean); return t.length ? t : ["我"]; }
function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q + " 福岡"); }
function planMap(p){ return p.map || (p.place ? mapUrl(p.place) : ""); }
// Read a place name out of a pasted Google Maps link (or the "name + address + link" text the Maps app shares)
function parseMapText(txt){
  const m = String(txt || "").match(/https?:\/\/[^\s<>"]+/); if (!m) return null;
  const url = m[0], before = txt.slice(0, m.index).trim().split(/\n/)[0].trim();
  let name = "";
  try {
    const u = new URL(url);
    if (!/(^|\.)google\.|goo\.gl$|^g\.co$/.test(u.hostname)) return null;
    const pm = u.pathname.match(/\/place\/([^/]+)/);
    if (pm) name = decodeURIComponent(pm[1].replace(/\+/g, " "));
    if (!name) name = u.searchParams.get("q") || u.searchParams.get("query") || "";
    if (/^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/.test(name.trim())) name = "";
  } catch { return null; }
  if (!name && before && before.length <= 60) name = before;
  return {url, name: name.trim(), short: /goo\.gl|\/\/g\.co\//.test(url)};
}
const spends = () => state.expenses.filter(e => e.cat !== XFER);
let toastTimer;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

// ---------- render ----------
function render(){
  const S = state.settings, days = numDays();
  if (state.day > days) state.day = days;
  $("tripName").textContent = S.name || "福岡行";
  const d1 = dayDate(1), dn = dayDate(days);
  $("tripDates").textContent = d1 ? `${d1.getFullYear()}/${d1.getMonth()+1}/${d1.getDate()} – ${dn.getMonth()+1}/${dn.getDate()}・${days} 天・${travelers().join("、")}` : `${days} 天・按「旅程設定」填出發日`;

  if (d1) {
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((d1 - today) / 864e5);
    if (diff > 0) { $("cdLabel").textContent = "出發倒數"; $("cdVal").textContent = diff + " 天"; }
    else if (diff > -days) { $("cdLabel").textContent = "旅途中"; $("cdVal").textContent = "Day " + (1 - diff); }
    else { $("cdLabel").textContent = "旅程"; $("cdVal").textContent = "完成!"; }
  } else { $("cdLabel").textContent = "出發倒數"; $("cdVal").textContent = "—"; }

  const done = state.todos.filter(t => t.done).length;
  $("todoStat").textContent = `${done}/${state.todos.length}`;
  const total = spends().reduce((a,e) => a + toJPY(e), 0);
  $("spendStat").textContent = twd(total * rate());

  $("modeNote").textContent = state.mode === "sheet" ? (pending ? "～ 同步到 Google 試算表中… ～" : "～ 資料存在 Google 試算表，每 20 秒自動更新 ～")
    : state.mode === "db" ? "～ 資料即時同步，分享此頁給旅伴就能一起編輯 ～"
    : state.mode === "local" ? "～ 資料存在這台裝置的瀏覽器中 ～" : "載入中…";

  renderPlan(days); renderTodo(done); renderMoney(total);
}

function renderPlan(days){
  let h = "";
  for (let i = 1; i <= days; i++) {
    const n = state.plans.filter(p => p.day === i).length;
    h += `<button class="day" type="button" data-day="${i}" aria-pressed="${i===state.day}">Day ${i}<small>${dayLabel(i) || (n ? n + " 項" : "&nbsp;")}</small></button>`;
  }
  $("days").innerHTML = h;
  const items = state.plans.filter(p => p.day === state.day).sort((a,b) => (a.time||"99").localeCompare(b.time||"99") || (a.created||0)-(b.created||0));
  if (state.mode === "loading") { $("planList").innerHTML = LOADING; return; }
  if (!items.length) { $("planList").innerHTML = `<div class="empty">${SNAIL}Day ${state.day} 還是空白頁，小蝸牛在這裡慢慢等。<br>按「新增行程」，或到「清單」把口袋名單排進來。</div>`; return; }
  $("planList").innerHTML = `<ol class="timeline">` + items.map((p,i) => `
    <li class="stop"><time>${esc(p.time || "—")}</time>
      <button class="card sketch" type="button" data-plan="${esc(p.id)}">
        <div class="t">${esc(p.title)}${p.sample ? '<span class="tag">範例</span>' : ""}</div>
        ${p.place ? `<div class="meta">地點・${esc(p.place)}</div>` : ""}
        ${p.note ? `<div class="meta">${esc(p.note)}</div>` : ""}
      </button>
      ${planMap(p) ? `<a class="map" href="${esc(planMap(p))}" target="_blank" rel="noopener">→ 在 Google 地圖開啟</a>` : ""}
    </li>`).join("") + `</ol>`;
}

function renderTodo(done){
  const n = state.todos.length;
  $("todoBar").style.width = n ? (done / n * 100) + "%" : "0";
  if (!$("todoGroup").options.length) $("todoGroup").innerHTML =
    `<optgroup label="待辦">${TODO_GROUPS.map(g => `<option>${g}</option>`).join("")}</optgroup><optgroup label="口袋名單">${WISH_GROUPS.map(g => `<option>${g}</option>`).join("")}</optgroup>`;
  if (state.mode === "loading") { $("todoList").innerHTML = LOADING; return; }
  if (!n) { $("todoList").innerHTML = `<div class="empty">${SNAIL}清單是空的。在上方寫下第一件要準備的事。</div>`; return; }
  const groups = [...GROUPS, ...new Set(state.todos.map(t => t.group).filter(g => !GROUPS.includes(g)))];
  
  $("todoList").innerHTML = groups.map(g => {
    const list = state.todos.filter(t => (t.group || "出發前") === g).sort((a,b) => (a.done - b.done) || (a.created||0)-(b.created||0));
    if (!list.length) return "";
    const wish = WISH_GROUPS.includes(g);
    return `<div class="group"><h3>${wish ? "♡ " : ""}${esc(g)}<span class="num">${list.filter(t=>t.done).length}/${list.length}</span></h3><ul class="todos sketch">` +
      list.map(t => `<li class="${t.done ? "done" : ""}"><label><input type="checkbox" data-todo="${esc(t.id)}" ${t.done ? "checked" : ""}><span class="txt">${esc(t.text)}${t.sample ? '<span class="tag">範例</span>' : ""}</span></label>${wish ? `<button class="mini" type="button" data-toplan="${esc(t.id)}">排入行程</button>` : ""}<button class="x" type="button" data-deltodo="${esc(t.id)}" aria-label="刪除 ${esc(t.text)}">×</button></li>`).join("") +
      `</ul></div>`;
  }).join("");
}

function renderMoney(total){
  const T = travelers();
  const per = total / T.length;
  $("moneyStats").innerHTML = `
    <div class="stat sketch"><span>總花費</span><b>${both(total)}</b></div>
    <div class="stat sketch"><span>每人 (${T.length})</span><b>${both(per)}</b></div>
    <div class="stat sketch"><span>筆數</span><b>${spends().length}</b></div>`;
  if (state.mode === "loading") { $("moneyBody").innerHTML = LOADING; return; }
  if (!state.expenses.length) { $("moneyBody").innerHTML = `<div class="empty">${SNAIL}還沒有記錄。按「記一筆」輸入金額，日圓或台幣都可以。</div>`; return; }

  let h = "";
  const byCat = {}; for (const e of spends()) byCat[e.cat || "其他"] = (byCat[e.cat || "其他"] || 0) + toJPY(e);
  if (Object.keys(byCat).length) {
    const max = Math.max(...Object.values(byCat));
    h += `<h2>分類</h2><div class="cats">` + Object.entries(byCat).sort((a,b) => b[1]-a[1]).map(([c,v]) =>
      `<div class="cat"><span>${esc(c)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><span class="num">${twd(v * rate())}</span></div>`).join("") + `</div>`;
  }

  if (T.length > 1) {
    // net = what each person has actually put in (payments + transfers sent − transfers received)
    const net = Object.fromEntries(T.map(t => [t, 0]));
    const who = p => p in net ? p : T[0];
    for (const e of state.expenses) {
      const v = toJPY(e);
      if (e.cat === XFER) { net[who(e.payer)] += v; if (e.to in net) net[e.to] -= v; }
      else net[who(e.payer)] += v;
    }
    const bal = T.map(t => [t, net[t] - per]);
    const creditors = bal.filter(b => b[1] > 0.5).map(b => [...b]), debtors = bal.filter(b => b[1] < -0.5).map(b => [b[0], -b[1]]);
    const moves = [];
    for (const d of debtors) for (const c of creditors) {
      const m = Math.min(d[1], c[1]); if (m < 0.5) continue;
      moves.push([d[0], c[0], m]); d[1] -= m; c[1] -= m;
    }
    h += `<h2>分帳（平均分攤）</h2><ul class="settle sketch">` + T.map(t =>
      `<li><span>${esc(t)} 實付</span><span class="num">${twd(net[t] * rate())}</span></li>`).join("") +
      (moves.length ? moves.map(([a,b,m]) => `<li class="verdict"><span>${esc(a)} → ${esc(b)}</span><span class="num neg">${twd(m * rate())}</span></li>`).join("")
        : `<li class="verdict"><span class="pos">${SNAIL} 目前已打平！</span></li>`) + `</ul>`;
  }

  h += `<h2>明細</h2>`;
  const dayKeys = [...new Set(state.expenses.map(e => e.day || 0))].sort((a,b) => a - b);
  for (const [ki, dk] of dayKeys.entries()) {
    const list = state.expenses.filter(e => (e.day || 0) === dk).sort((a,b) => (a.created||0)-(b.created||0));
    const sum = list.filter(e => e.cat !== XFER).reduce((a,e) => a + toJPY(e), 0);
    h += `<div class="dayhead">${dk ? `Day ${dk} ${dayLabel(dk)}` : "出發前 / 未分日"}・小計 <span class="num">${twd(sum * rate())}</span></div><ul class="ledger sketch">` +
      list.map(e => `<li><button type="button" data-exp="${esc(e.id)}">
        <span class="desc"><span class="pill ${e.cat === XFER ? "xfer" : ""}">${esc(e.cat || "其他")}</span>${esc(e.note || "")}${e.sample ? '<span class="tag">範例</span>' : ""}</span>
        <span class="amt">${native(e)}</span>
        <span class="sm">${e.cat === XFER ? `${esc(e.payer)} → ${esc(e.to || "?")}` : `${esc(e.payer || T[0])} 付`}</span>
        <span class="sm" style="text-align:right">${other(e)}</span>
      </button></li>`).join("") + `</ul>`;
  }
  $("moneyBody").innerHTML = h;
}

// ---------- sheets ----------
let sheetSubmit = null;
function openSheet(html, onSubmit){
  $("sheet").innerHTML = html; sheetSubmit = onSubmit; $("scrim").hidden = false;
  const f = $("sheet").querySelector("input:not([type=hidden]),select,textarea"); if (f) setTimeout(() => f.focus(), 30);
}
function closeSheet(){ $("scrim").hidden = true; $("sheet").innerHTML = ""; sheetSubmit = null; }
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeSheet(); });
$("sheet").addEventListener("submit", e => { e.preventDefault(); if (sheetSubmit) sheetSubmit(new FormData($("sheet"))); });
$("sheet").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.close != null) closeSheet();
  if (b.dataset.chip) {
    const g = b.parentElement; g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    g.nextElementSibling.value = b.dataset.chip;
    const to = $("f-to-wrap"); if (to) to.hidden = b.dataset.chip !== XFER;
  }
  if (b.dataset.del != null) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "確定刪除？"; return; }
    const [coll, id] = b.dataset.del.split(":"); delItem(coll, id); closeSheet();
  }
});
function chips(name, options, value){
  return `<div class="chips">${options.map(o => `<button type="button" data-chip="${esc(o)}" aria-pressed="${o===value}">${esc(o)}</button>`).join("")}</div><input type="hidden" name="${name}" value="${esc(value)}">`;
}
function daySelect(value, allowNone){
  let o = allowNone ? `<option value="0" ${!value ? "selected" : ""}>出發前 / 未分日</option>` : "";
  for (let i = 1; i <= numDays(); i++) o += `<option value="${i}" ${i===value ? "selected" : ""}>Day ${i} ${dayLabel(i)}</option>`;
  return `<select name="day" id="f-day">${o}</select>`;
}
function personSelect(name, id, list, value){
  return `<select name="${name}" id="${id}">${[...new Set([...list, value].filter(Boolean))].map(t => `<option ${t===value?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
}
function actions(delKey){
  return `<div class="actions">${delKey ? `<button type="button" class="danger" data-del="${esc(delKey)}">刪除</button>` : "<span></span>"}
    <div class="row"><button type="button" class="ghost" data-close>取消</button><button type="submit" class="primary">儲存</button></div></div>`;
}

function planSheet(p, after){
  p = p || {day: state.day, time:"", title:"", place:"", note:""};
  openSheet(`<h3>${p.id ? "編輯行程" : "新增行程"}</h3>
    <div class="two"><label class="field">日期${daySelect(p.day)}</label>
    <label class="field">時間<input type="time" name="time" id="f-time" value="${esc(p.time)}"></label></div>
    <label class="field">要做什麼<input name="title" id="f-title" required value="${esc(p.title)}" placeholder="例如：一蘭拉麵總本店"></label>
    <label class="field">地點（可以直接貼 Google 地圖連結）<input name="place" id="f-place" value="${esc(p.place)}" placeholder="博多駅，或貼上 maps.app.goo.gl/… 連結" autocomplete="off">
      <input type="hidden" name="map" id="f-map" value="${esc(p.map || "")}"><span class="map-hint" id="f-maphint">${p.map ? "已連結 Google 地圖位置 ✓" : ""}</span></label>
    <label class="field">備註<textarea name="note" id="f-note" rows="2" placeholder="交通方式、預約編號…">${esc(p.note)}</textarea></label>
    ${actions(p.id && "plans:" + p.id)}`,
  fd => {
    const data = {day:Number(fd.get("day")), time:fd.get("time"), title:fd.get("title").trim(), place:fd.get("place").trim(), map:fd.get("map") || "", note:fd.get("note").trim(), sample:false};
    if (!data.title) return;
    p.id ? updItem("plans", p.id, data) : addItem("plans", data);
    state.day = data.day; closeSheet();
    if (after) after();
  });
  $("f-place").addEventListener("input", onPlaceInput);
  $("f-place").addEventListener("paste", onPlaceInput);   // paste keeps the line breaks of the Maps app's share text
}
function onPlaceInput(e){
  const input = e.target, hint = $("f-maphint"), mapF = $("f-map");
  const raw = e.type === "paste" ? (e.clipboardData && e.clipboardData.getData("text")) || "" : input.value;
  const info = parseMapText(raw);
  if (e.type === "paste") { if (!info) return; e.preventDefault(); }
  if (!info) { if (!/https?:/.test(raw)) return; hint.textContent = "這不是 Google 地圖連結，請貼地圖 App「分享」的連結"; return; }
  mapF.value = info.url;
  const fill = name => {
    if (!$("f-place")) return;           // sheet closed meanwhile
    input.value = name;
    const t = $("f-title"); if (t && !t.value.trim()) t.value = name;
    hint.textContent = "已帶入地點，地圖會開這個位置 ✓";
  };
  if (info.name) { fill(info.name); return; }
  input.value = "";
  if (GAS) {
    hint.textContent = "讀取地點名稱中…";
    GAS.withSuccessHandler(full => { const again = parseMapText(full || ""); if (again && again.name) fill(again.name); else hint.textContent = "讀不出名稱，請自己輸入地點名稱（連結已保留）"; })
       .withFailureHandler(() => { hint.textContent = "讀不出名稱，請自己輸入地點名稱（連結已保留）"; })
       .resolveMapLink(info.url);
  } else hint.textContent = "已保留地圖連結，請自己輸入地點名稱";
}

function expSheet(e){
  const T = travelers();
  const today = (() => { const d1 = dayDate(1); if (!d1) return 0; const t = new Date(); t.setHours(0,0,0,0); const n = Math.round((t - d1)/864e5) + 1; return n >= 1 && n <= numDays() ? n : 0; })();
  e = e || {amount:"", currency:"JPY", cat:"餐飲", payer:T[0], to:T[1] || "", day:today, note:""};
  openSheet(`<h3>${e.id ? "編輯這筆" : "記一筆"}</h3>
    <div class="two"><label class="field">金額<input type="number" inputmode="decimal" min="0" step="any" name="amount" id="f-amount" required value="${esc(e.amount)}"></label>
    <label class="field">幣別<select name="currency" id="f-cur"><option value="JPY" ${e.currency!=="TWD"?"selected":""}>日圓 ¥</option><option value="TWD" ${e.currency==="TWD"?"selected":""}>台幣 NT$</option></select></label></div>
    <div class="field">分類${chips("cat", CATS, e.cat || "其他")}</div>
    <div class="two"><label class="field">誰付的${personSelect("payer","f-payer",T,e.payer)}</label>
    <label class="field" id="f-to-wrap" ${e.cat === XFER ? "" : "hidden"}>轉給誰${personSelect("to","f-to",T,e.to || T.find(t => t !== e.payer))}</label></div>
    <label class="field">哪一天${daySelect(e.day, true)}</label>
    <label class="field">說明<input name="note" id="f-enote" value="${esc(e.note)}" placeholder="例如：一蘭拉麵"></label>
    ${actions(e.id && "expenses:" + e.id)}`,
  fd => {
    const amount = Number(fd.get("amount"));
    if (!(amount > 0)) { toast("請輸入大於 0 的金額"); return; }
    const cat = fd.get("cat");
    const data = {amount, currency:fd.get("currency"), cat, payer:fd.get("payer"), day:Number(fd.get("day")), note:fd.get("note").trim(), sample:false};
    if (cat === XFER) {
      data.to = fd.get("to");
      if (data.to === data.payer) { toast("轉帳的兩個人不能是同一位"); return; }
    }
    e.id ? updItem("expenses", e.id, data) : addItem("expenses", data);
    closeSheet();
  });
}

function settingsSheet(){
  const S = state.settings;
  openSheet(`<h3>旅程設定</h3>
    <label class="field">旅程名稱<input name="name" id="s-name" value="${esc(S.name)}"></label>
    <div class="two"><label class="field">出發日<input type="date" name="start" id="s-start" value="${esc(S.start)}"></label>
    <label class="field">天數<input type="number" min="1" max="30" name="days" id="s-days" value="${esc(S.days)}"></label></div>
    <label class="field">匯率：1 台幣 = ? 日圓<input type="number" step="0.01" min="0" name="jpt" id="s-rate" value="${(1 / rate()).toFixed(2)}"></label>
    <label class="field">旅伴（用逗號分隔，用來分帳）<input name="travelers" id="s-trav" value="${esc((S.travelers||[]).join(", "))}"></label>
    ${state.mode === "sheet" ? `<div class="field">Google 試算表同步：已連線
      <div class="row"><button type="button" class="ghost" id="copyShare">複製分享連結</button></div>
      <span id="shareOut" style="overflow-wrap:anywhere"></span></div>` : ""}
    ${actions(null)}`,
  fd => {
    const jpt = Number(fd.get("jpt"));
    saveSettings({
      name: fd.get("name").trim() || "福岡行",
      start: fd.get("start"),
      days: Math.max(1, Math.min(30, Number(fd.get("days")) || 4)),
      rate: jpt > 0 ? 1 / jpt : rate(),
      travelers: fd.get("travelers").split(/[,，、]/).map(s => s.trim()).filter(Boolean)
    });
    closeSheet();
  });
}

$("sheet").addEventListener("click", e => {
  if (!e.target.closest("#copyShare")) return;
  const out = $("shareOut");
  if (!shareLink) { out.textContent = "還拿不到網址，請稍後再試"; return; }
  const show = () => { out.textContent = shareLink; };
  try { navigator.clipboard.writeText(shareLink).then(() => { out.textContent = "已複製，傳給旅伴用手機打開就能一起編輯"; }, show); } catch { show(); }
});

// ---------- events ----------
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === tab));
  for (const t of ["plan","todo","money"]) $("panel-" + t).hidden = t !== tab;
  try { localStorage.setItem(LS_KEY + "-tab", tab); } catch {}
  window.scrollTo(0, 0);
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
$("days").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (b) { state.day = Number(b.dataset.day); render(); } });
$("planList").addEventListener("click", e => { const b = e.target.closest("[data-plan]"); if (b) planSheet({...state.plans.find(p => p.id === b.dataset.plan)}); });
$("addPlan").addEventListener("click", () => planSheet());
$("addExp").addEventListener("click", () => expSheet());
$("moneyBody").addEventListener("click", e => { const b = e.target.closest("[data-exp]"); if (b) expSheet({...state.expenses.find(x => x.id === b.dataset.exp)}); });
$("openSettings").addEventListener("click", settingsSheet);
$("todoForm").addEventListener("submit", e => {
  e.preventDefault(); const text = $("todoText").value.trim(); if (!text) return;
  addItem("todos", {group:$("todoGroup").value, text, done:false}); $("todoText").value = ""; $("todoText").focus();
});
$("todoList").addEventListener("change", e => { const c = e.target.closest("[data-todo]"); if (c) updItem("todos", c.dataset.todo, {done:c.checked}); });
$("todoList").addEventListener("click", e => {
  const d = e.target.closest("[data-deltodo]"); if (d) { delItem("todos", d.dataset.deltodo); return; }
  const p = e.target.closest("[data-toplan]");
  if (p) {
    const t = state.todos.find(x => x.id === p.dataset.toplan); if (!t) return;
    planSheet({day:state.day, time:"", title:t.text, place:"", note:""}, () => {
      if (!t.done) updItem("todos", t.id, {done:true});
      setTab("plan"); render(); toast("已排入 Day " + state.day);
    });
  }
});

try { const t = localStorage.getItem(LS_KEY + "-tab"); if (t && t !== "plan") setTab(t); } catch {}

// ---------- boot ----------
render();
if (GAS) startSheet();
else if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("db").then(d => { if (d) { db = d; startDb(); } else startLocal(); }).catch(startLocal);
} else startLocal();
})();
</script>
