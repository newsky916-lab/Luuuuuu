<title>福岡行旅帳</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=LXGW+WenKai+TC:wght@300;400;700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: a warm ivory sketchbook in a Claude-like hand-drawn mood — ink outlines over flat organic color blobs (clay, oat, cactus, heather), handwritten type, fixed bottom tab bar, bottom sheets for editing. Dark = warm charcoal. */
:root{
  --paper:#f5f2ea; --card:#fbfaf6; --ink:#1f1e1c; --muted:#6e6a62; --line:#d9d3c5;
  --clay:#d97757; --clay-ink:#b4532f; --clay-soft:rgba(217,119,87,.28);
  --oat:#e3dacc; --cactus:#bcd1ca; --heather:#cbcadb; --olive:#788c5d; --ok:#5f7a45;
  --on-clay:#fffaf5; --scrim:rgba(31,30,28,.4);
  --dino:#9fd0a2; --belly:#eef6e2; --blush:#f2a7a0; --mustard:#e8c46a;
  --f-hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti",cursive,serif;
  --f-num:"Caveat","LXGW WenKai TC",cursive;
  --f-serif:"Newsreader","Georgia","Times New Roman",serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  --wob2:18px 225px 18px 255px/255px 18px 225px 18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#262624; --card:#30302e; --ink:#f2efe6; --muted:#a8a395; --line:#45443f;
  --clay:#e0896b; --clay-ink:#f0a184; --clay-soft:rgba(224,137,107,.3);
  --oat:#4a443a; --cactus:#3c4a45; --heather:#45445a; --olive:#a3b585; --ok:#a9c48a;
  --on-clay:#1f1e1c; --scrim:rgba(0,0,0,.55); --dino:#7fb486; --belly:#d9e8c8; --blush:#e48f88; --mustard:#c9a54f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#262624; --card:#30302e; --ink:#f2efe6; --muted:#a8a395; --line:#45443f;
  --clay:#e0896b; --clay-ink:#f0a184; --clay-soft:rgba(224,137,107,.3);
  --oat:#4a443a; --cactus:#3c4a45; --heather:#45445a; --olive:#a3b585; --ok:#a9c48a;
  --on-clay:#1f1e1c; --scrim:rgba(0,0,0,.55); --dino:#7fb486; --belly:#d9e8c8; --blush:#e48f88; --mustard:#c9a54f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-hand);font-size:16px;line-height:1.65;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--clay-ink);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.num{font-family:var(--f-num);font-size:1.15em;font-weight:700}

/* ink line over a flat color blob, slightly offset — the illustration look */
.sketch{background:var(--card);border:1.8px solid var(--ink);border-radius:var(--wob);box-shadow:5px 6px 0 -1px var(--oat)}
.tape{position:relative}
/* washi tape: patterned, translucent, torn ends */
.wt,.tape::before{content:"";position:absolute;width:74px;height:20px;opacity:.88;pointer-events:none;
  clip-path:polygon(0 12%,6% 0,14% 10%,22% 0,100% 0,96% 14%,100% 28%,95% 44%,100% 60%,96% 76%,100% 100%,0 100%,4% 84%,0 68%,5% 52%,0 36%,4% 24%);
  background:repeating-linear-gradient(-45deg,var(--clay) 0 5px,var(--clay-soft) 5px 10px)}
.tape::before{top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg)}
.tape.t2::before{left:auto;right:-14px;top:-8px;transform:rotate(38deg);background:radial-gradient(var(--card) 2.2px,transparent 2.6px) 0 0/9px 9px,var(--cactus)}
.tape.t3::before{left:-16px;top:-6px;transform:rotate(-34deg);background:linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px) 0 0/7px 7px,linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px) 0 0/7px 7px,var(--heather)}
.tape.t4::before{background:var(--mustard);transform:translateX(-50%) rotate(2deg);width:58px}

/* 阿龍 */
.ryu{display:block;width:64px;height:64px;overflow:visible}
.hero-art{position:relative;width:132px;height:100px;margin-top:14px}
.hero-art .doodle{position:absolute;right:0;top:0}
.hero-art .ryu{position:absolute;left:-14px;bottom:-6px;width:62px;height:62px;animation:bob 3s ease-in-out infinite}
.bubble{position:absolute;left:4px;top:-20px;background:var(--card);border:1.6px solid var(--ink);border-radius:14px 16px 14px 4px;padding:0 8px;font-size:.78rem;white-space:nowrap;transform:rotate(-6deg)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.empty .ryu{margin:0 auto 6px;width:72px;height:72px}
.loading .ryu{width:44px;height:44px;animation:bob 1s ease-in-out infinite}
.peek{position:absolute;left:8px;top:-30px;width:42px;height:42px;clip-path:inset(0 0 24% 0)}
.verdict .ryu{display:inline-block;width:36px;height:36px;vertical-align:middle}

/* header */
header.top{padding-block:20px 6px;display:grid;gap:16px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.eyebrow{font-family:var(--f-serif);font-style:italic;color:var(--clay-ink);font-size:.95rem;margin:0;display:flex;align-items:center;gap:6px}
.spark{width:20px;height:20px;flex:0 0 auto}
.spark path{stroke:var(--clay);stroke-width:2.6;stroke-linecap:round;fill:none}
h1{font-weight:700;font-size:2rem;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem;margin:4px 0 0}
.doodle{width:118px;height:96px;max-width:100%}
.doodle .blob{fill:var(--clay)} .doodle .blob2{fill:var(--cactus)}
.doodle .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{justify-self:start;border:1.8px solid var(--ink);background:var(--card);border-radius:var(--wob2);padding:3px 14px;font-size:.9rem;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{padding:10px 8px 8px;min-width:0;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:1.4rem;line-height:1.15;white-space:nowrap}
.stat b small{display:block;font-size:.95rem;color:var(--muted);font-weight:500}
.stat span{font-size:.8rem;color:var(--muted)}

h2{font-weight:700;font-size:1.3rem;margin:30px 0 12px;display:inline-block;padding:2px 18px;transform:rotate(-1.5deg);background:repeating-linear-gradient(90deg,var(--clay-soft) 0 8px,transparent 8px 16px),var(--oat);clip-path:polygon(0 8%,4% 0,100% 6%,97% 30%,100% 55%,96% 78%,100% 100%,3% 94%,0 70%,4% 48%,0 26%)}
.panel[hidden]{display:none}

/* day strip */
.days{display:flex;gap:10px;overflow-x:auto;padding-block:8px 12px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.day{flex:0 0 auto;border:1.8px solid var(--ink);background:var(--card);border-radius:var(--wob2);padding:4px 12px;text-align:center;line-height:1.2;font-family:var(--f-num);font-size:1.25rem;font-weight:700}
.day small{display:block;font-family:var(--f-hand);font-size:.75rem;font-weight:400;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--clay);color:var(--on-clay)}
.day[aria-pressed="true"] small{color:var(--on-clay)}

/* timeline */
.timeline{list-style:none;margin:10px 0 0 58px;padding:0;border-left:1.8px dashed var(--muted)}
.stop{position:relative;padding:4px 0 20px 20px}
.stop::before{content:"";position:absolute;left:-9px;top:12px;width:15px;height:15px;border-radius:62% 38% 55% 45%/48% 60% 40% 52%;background:var(--clay);border:1.8px solid var(--ink)}
.stop time{position:absolute;left:-66px;top:2px;width:54px;text-align:right;font-family:var(--f-num);font-size:1.3rem;font-weight:700;color:var(--clay-ink)}
.stop button.card{display:block;width:100%;text-align:left;padding:10px 14px}
.stop .t{font-weight:700;font-size:1.05rem}
.stop .meta{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.stop .map{display:inline-block;margin-top:8px;font-size:.88rem;color:var(--clay-ink);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px;text-decoration-thickness:1px}
.tag{display:inline-block;font-size:.72rem;padding:0 6px;border:1.5px solid var(--muted);border-radius:var(--wob2);color:var(--muted);vertical-align:2px;margin-left:6px}

.empty{border:1.8px dashed var(--muted);border-radius:var(--wob);padding:18px;text-align:center;color:var(--muted);margin-top:10px}
.loading{display:inline-flex;align-items:center;gap:8px}
.loading .spark{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.primary{background:var(--clay);color:var(--on-clay);border:1.8px solid var(--ink);border-radius:var(--wob2);padding:7px 18px;font-weight:700;box-shadow:2px 3px 0 var(--ink)}
.primary:active{transform:translate(2px,2px);box-shadow:0 1px 0 var(--ink)}
.ghost{background:var(--card);border:1.8px solid var(--ink);border-radius:var(--wob);padding:7px 16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add-row{margin-top:18px}

/* lists */
.bar{height:12px;border:1.8px solid var(--ink);border-radius:var(--wob);overflow:hidden;background:var(--card)}
.bar i{display:block;height:100%;background:var(--olive);transition:width .3s}
.todo-form{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;margin-top:16px}
.todo-form select,.todo-form input{border:0;border-bottom:1.8px solid var(--ink);background:transparent;padding:6px 4px;min-width:0;border-radius:0}
.group h3{font-size:1.05rem;margin:24px 0 10px;font-weight:700}
.group h3 .num{color:var(--clay-ink);margin-left:6px}
.todos{list-style:none;margin:0;padding:6px 4px}
.todos li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1.5px dashed var(--line)}
.todos li:first-child{border-top:0}
.todos label{flex:1;display:flex;gap:12px;align-items:flex-start;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.todos input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:22px;height:22px;margin:2px 0 0;border:1.8px solid var(--ink);border-radius:5px 8px 6px 9px;background:var(--card);position:relative;cursor:pointer}
.todos input[type=checkbox]:checked{background:var(--oat)}
.todos input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:-7px;width:9px;height:18px;border:solid var(--clay);border-width:0 3.5px 3.5px 0;transform:rotate(40deg)}
.todos li.done label span.txt{text-decoration:line-through;text-decoration-color:var(--clay);text-decoration-thickness:2px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;padding:0 6px;line-height:1}
.mini{border:1.5px solid var(--ink);background:var(--cactus);border-radius:var(--wob2);font-size:.8rem;padding:1px 8px;white-space:nowrap}

/* money */
.cats{display:grid;gap:10px;margin-top:6px}
.cat{display:grid;grid-template-columns:4em minmax(0,1fr) auto;gap:10px;align-items:center}
.cat .bar i{background:var(--clay)}
.settle{list-style:none;padding:12px 14px;margin:0;display:grid;gap:8px}
.settle li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.settle .verdict{margin-top:4px;padding-top:8px;border-top:1.5px dashed var(--muted);font-weight:700}
.pos{color:var(--ok)} .neg{color:var(--clay-ink)}
.ledger{list-style:none;margin:0;padding:4px}
.ledger li{border-top:1.5px dashed var(--line)}
.ledger li:first-child{border-top:0}
.ledger button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;width:100%;padding:10px 12px;cursor:pointer}
.ledger button:focus-visible{outline:2px dashed var(--clay-ink);outline-offset:-2px}
.ledger .desc{min-width:0;overflow-wrap:anywhere}
.ledger .amt{text-align:right;font-family:var(--f-num);font-weight:700;font-size:1.35rem;line-height:1.2}
.ledger .sm{font-size:.82rem;color:var(--muted)}
.pill{display:inline-block;font-size:.78rem;padding:0 8px;border-radius:var(--wob2);background:var(--oat);margin-right:6px}
.pill.xfer{background:var(--heather)}
.dayhead{font-size:.95rem;color:var(--muted);margin:20px 0 8px}

/* tab bar */
nav.tabs{position:fixed;overflow:visible;left:0;right:0;bottom:0;background:var(--paper);border-top:1.8px solid var(--ink);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;z-index:5}
nav.tabs button{flex:1;max-width:180px;border:1.8px solid transparent;background:none;border-radius:var(--wob2);padding:4px;color:var(--muted)}
nav.tabs button span{display:block;font-size:1.15rem;font-weight:700}
nav.tabs button small{font-family:var(--f-serif);font-style:italic;font-size:.82rem}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);background:var(--oat)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--card);width:100%;max-width:560px;border:1.8px solid var(--ink);border-bottom:0;border-radius:26px 32px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;display:grid;gap:14px}
.sheet h3{font-size:1.3rem;margin:0;display:flex;align-items:center;gap:8px}
.field{display:grid;gap:2px;font-size:.88rem;color:var(--muted)}
.field input,.field select,.field textarea{border:0;border-bottom:1.8px solid var(--ink);background:transparent;border-radius:0;padding:6px 2px;font-size:1.05rem;color:var(--ink);width:100%;min-width:0}
.field textarea{border:1.8px solid var(--ink);border-radius:var(--wob);padding:8px}
.field select option{background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips button{border:1.8px solid var(--ink);background:var(--card);border-radius:var(--wob2);padding:2px 12px;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--clay);color:var(--on-clay)}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.danger{background:var(--card);border:1.8px dashed var(--clay-ink);color:var(--clay-ink);border-radius:var(--wob);padding:7px 14px}
.danger.armed{background:var(--clay-ink);color:var(--card);border-style:solid}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 16px;border-radius:var(--wob2);z-index:20;max-width:calc(100% - 32px)}
.note{font-family:var(--f-serif);font-style:italic;font-size:.9rem;color:var(--muted);margin-top:32px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ryu" viewBox="0 0 100 100">
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path style="fill:var(--dino)" d="M24 72C13 73 6 66 3 57c7 5 14 7 22 6z"/>
    <circle style="fill:var(--clay)" cx="31" cy="49" r="4.5"/><circle style="fill:var(--clay)" cx="37" cy="37" r="4.5"/><circle style="fill:var(--clay)" cx="46" cy="27" r="4.5"/>
    <path style="fill:var(--dino)" d="M26 90C14 90 12 74 20 66c4-6 8-10 14-12 0-14 6-30 24-32 18-2 28 10 26 22-2 10-10 14-18 14 4 6 8 16 6 24-2 8-10 8-16 8z"/>
    <ellipse style="fill:var(--belly)" cx="49" cy="75" rx="12" ry="11"/>
    <ellipse style="fill:var(--dino)" cx="36" cy="91" rx="8" ry="3.5"/><ellipse style="fill:var(--dino)" cx="60" cy="91" rx="8" ry="3.5"/>
    <path fill="none" d="M62 65q7 1 9-5M72 50q4 3 8 0"/>
  </g>
  <circle fill="currentColor" cx="70" cy="38" r="3.4"/><circle fill="#fff" cx="71.2" cy="36.8" r="1.1"/>
  <ellipse style="fill:var(--blush)" cx="78" cy="45" rx="4" ry="2.4"/>
</symbol></defs></svg>
  <header class="top">
    <div class="hero">
      <div>
        <p class="eyebrow"><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.4 6-.3 12 .2 19M2.5 12.3c6-.4 12 .3 19-.2M5.2 5c4.3 4.6 9 9.3 13.7 14M18.8 5.2C14.3 9.6 9.8 14.2 5 18.9"/></svg>Fukuoka trip notebook</p>
        <h1 id="tripName">福岡行</h1>
        <p class="sub" id="tripDates">博多・天神・太宰府</p>
      </div>
      <div class="hero-art" aria-hidden="true">
      <span class="bubble">阿龍：出發囉！</span>
      <svg class="doodle" viewBox="0 0 120 96">
        <path class="blob" d="M84 12c11 0 19 8 18 19s-9 18-19 17-18-8-17-18 7-18 18-18z"/>
        <path class="blob2" d="M4 80c10-14 30-20 48-12s30 4 40 10c-8 10-80 12-88 2z"/>
        <path class="ln" d="M38 84 46 14 54 84M41 62h10M43 40h6M46 14V5M10 89c6-4 12-4 18 0s12 4 18 0 12-4 18 0 12 4 18 0 12-4 18 0"/>
      </svg>
      <svg class="ryu" style="color:var(--ink)"><use href="#ryu"/></svg>
      </div>
    </div>
    <button class="icon-btn" id="openSettings" type="button">旅程設定 ✎</button>
    <div class="stats">
      <div class="stat sketch tape"><span id="cdLabel">出發倒數</span><b id="cdVal">—</b></div>
      <div class="stat sketch tape t4"><span>清單完成</span><b id="todoStat">0/0</b></div>
      <div class="stat sketch tape t2"><span>已花費</span><b id="spendStat">NT$0</b></div>
    </div>
  </header>

  <section class="panel" id="panel-plan">
    <h2>每日行程</h2>
    <div class="days" id="days" role="group" aria-label="選擇日期"></div>
    <div id="planList"></div>
    <div class="row add-row"><button class="primary" type="button" id="addPlan">＋ 新增行程</button></div>
  </section>

  <section class="panel" id="panel-todo" hidden>
    <h2>清單 &amp; 口袋名單</h2>
    <div class="bar" aria-hidden="true"><i id="todoBar" style="width:0"></i></div>
    <form class="todo-form" id="todoForm">
      <select id="todoGroup" aria-label="分類"></select>
      <input id="todoText" placeholder="寫下要做的事或想去的地方…" aria-label="項目" autocomplete="off">
      <button class="primary" type="submit">加入</button>
    </form>
    <div id="todoList"></div>
  </section>

  <section class="panel" id="panel-money" hidden>
    <h2>記帳本</h2>
    <div class="stats" id="moneyStats"></div>
    <div class="row add-row"><button class="primary" type="button" id="addExp">＋ 記一筆</button></div>
    <div id="moneyBody"></div>
  </section>

  <p class="note" id="modeNote"></p>
</div>

<nav class="tabs" role="tablist">
  <svg class="ryu peek" style="color:var(--ink)" aria-hidden="true"><use href="#ryu"/></svg>
  <button role="tab" aria-selected="true" data-tab="plan" type="button"><span>行程</span><small>plan</small></button>
  <button role="tab" aria-selected="false" data-tab="todo" type="button"><span>清單</span><small>list</small></button>
  <button role="tab" aria-selected="false" data-tab="money" type="button"><span>記帳</span><small>money</small></button>
</nav>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true"></form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const DEFAULT_SETTINGS = { name:"福岡行", start:"", days:4, rate:0.2469, travelers:["我","旅伴"] };
const TODO_GROUPS = ["出發前","行李","當地"];
const WISH_GROUPS = ["景點","逛街","美食","伴手禮"];
const GROUPS = [...TODO_GROUPS, ...WISH_GROUPS];
const CATS = ["機票","住宿","餐飲","交通","購物","門票","其他","轉帳"];
const XFER = "轉帳";
const WEEK = "日一二三四五六";
const LS_KEY = "fukuoka-trip-v1";
const SPARK = '<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.4 6-.3 12 .2 19M2.5 12.3c6-.4 12 .3 19-.2M5.2 5c4.3 4.6 9 9.3 13.7 14M18.8 5.2C14.3 9.6 9.8 14.2 5 18.9"/></svg>';
const RYU = '<svg class="ryu" style="color:var(--ink)" aria-hidden="true"><use href="#ryu"/></svg>';
const LOADING = `<div class="empty"><span class="loading">${RYU}阿龍翻筆記本中…</span></div>`;

// Local-only fallback content (used when the page runs outside the shared store)
const LOCAL_SAMPLE = {
  plans:[
    {day:1,time:"14:00",title:"抵達福岡機場",place:"福岡空港 国際線",note:"搭地鐵空港線到博多約 5 分鐘",sample:true}
  ],
  todos:[
    {group:"出發前",text:"確認護照效期",done:false,sample:true},
    {group:"美食",text:"中洲屋台",done:false,sample:true}
  ],
  expenses:[
    {amount:260,currency:"JPY",cat:"交通",payer:"我",day:1,note:"機場→博多 地鐵",sample:true}
  ]
};

const state = { plans:[], todos:[], expenses:[], settings:{...DEFAULT_SETTINGS}, tab:"plan", day:1, mode:"loading" };
let db = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const fmt = n => Math.round(n).toLocaleString("en-US");
const yen = n => "¥" + fmt(n);
const twd = n => "NT$" + fmt(n);

// ---------- store ----------
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify({plans:state.plans,todos:state.todos,expenses:state.expenses,settings:state.settings})); } catch {} }
function startLocal(){
  state.mode = "local";
  const saved = lsLoad();
  if (saved) Object.assign(state, {plans:saved.plans||[],todos:saved.todos||[],expenses:saved.expenses||[],settings:{...DEFAULT_SETTINGS,...saved.settings}});
  else { for (const k of ["plans","todos","expenses"]) state[k] = LOCAL_SAMPLE[k].map((x,i) => ({id:uid(),created:Date.now()+i,...x})); lsSave(); }
  render();
}
function startDb(){
  state.mode = "db";
  for (const coll of ["plans","todos","expenses"]) {
    db.collection(coll).onSnapshot(snap => {
      state[coll] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      render();
    }, e => toast("同步中斷：" + e.message));
  }
  db.doc("settings/trip").onSnapshot(snap => {
    state.settings = {...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {})};
    render();
  }, () => {});
  render();
}
function failMsg(e){
  if (e && e.code === "invalid_argument") return "你只有檢視權限，無法修改";
  if (e && e.code === "quota_exceeded") return "資料已達上限，請刪除一些項目";
  return "儲存失敗，請再試一次";
}
async function addItem(coll, data){
  data = {...data, created: Date.now()};
  if (db) { try { await db.collection(coll).add(data); } catch(e){ toast(failMsg(e)); } return; }
  state[coll].push({id:uid(), ...data}); lsSave(); render();
}
async function updItem(coll, id, patch){
  if (db) { try { await db.collection(coll).doc(id).update(patch); } catch(e){ toast(failMsg(e)); } return; }
  const it = state[coll].find(x => x.id === id); if (it) Object.assign(it, patch); lsSave(); render();
}
async function delItem(coll, id){
  if (db) { try { await db.collection(coll).doc(id).delete(); } catch(e){ toast(failMsg(e)); } return; }
  state[coll] = state[coll].filter(x => x.id !== id); lsSave(); render();
}
async function saveSettings(s){
  if (db) { try { await db.doc("settings/trip").set(s); } catch(e){ toast(failMsg(e)); } return; }
  state.settings = s; lsSave(); render();
}

// ---------- helpers ----------
function numDays(){ return Math.max(1, Math.min(30, Number(state.settings.days)||4)); }
function dayDate(n){
  const s = state.settings.start; if (!s) return null;
  const d = new Date(s + "T00:00:00"); if (isNaN(d)) return null;
  d.setDate(d.getDate() + n - 1); return d;
}
function dayLabel(n){
  const d = dayDate(n);
  return d ? `${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）` : "";
}
function rate(){ return Number(state.settings.rate) || DEFAULT_SETTINGS.rate; } // TWD per 1 JPY
function toJPY(e){ return e.currency === "TWD" ? e.amount / rate() : e.amount; }
function both(jpy){ return `${twd(jpy * rate())}<small>${yen(jpy)}</small>`; }
function native(e){ return e.currency === "TWD" ? twd(e.amount) : yen(e.amount); }
function other(e){ return e.currency === "TWD" ? "≈ " + yen(toJPY(e)) : "≈ " + twd(e.amount * rate()); }
function travelers(){ const t = (state.settings.travelers||[]).filter(Boolean); return t.length ? t : ["我"]; }
function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q + " 福岡"); }
const spends = () => state.expenses.filter(e => e.cat !== XFER);
let toastTimer;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

// ---------- render ----------
function render(){
  const S = state.settings, days = numDays();
  if (state.day > days) state.day = days;
  $("tripName").textContent = S.name || "福岡行";
  const d1 = dayDate(1), dn = dayDate(days);
  $("tripDates").textContent = d1 ? `${d1.getFullYear()}/${d1.getMonth()+1}/${d1.getDate()} – ${dn.getMonth()+1}/${dn.getDate()}・${days} 天・${travelers().join("、")}` : `${days} 天・按「旅程設定」填出發日`;

  if (d1) {
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((d1 - today) / 864e5);
    if (diff > 0) { $("cdLabel").textContent = "出發倒數"; $("cdVal").textContent = diff + " 天"; }
    else if (diff > -days) { $("cdLabel").textContent = "旅途中"; $("cdVal").textContent = "Day " + (1 - diff); }
    else { $("cdLabel").textContent = "旅程"; $("cdVal").textContent = "完成!"; }
  } else { $("cdLabel").textContent = "出發倒數"; $("cdVal").textContent = "—"; }

  const done = state.todos.filter(t => t.done).length;
  $("todoStat").textContent = `${done}/${state.todos.length}`;
  const total = spends().reduce((a,e) => a + toJPY(e), 0);
  $("spendStat").textContent = twd(total * rate());

  $("modeNote").textContent = state.mode === "db" ? "～ 資料即時同步，分享此頁給旅伴就能一起編輯 ～"
    : state.mode === "local" ? "～ 資料存在這台裝置的瀏覽器中 ～" : "載入中…";

  renderPlan(days); renderTodo(done); renderMoney(total);
}

function renderPlan(days){
  let h = "";
  for (let i = 1; i <= days; i++) {
    const n = state.plans.filter(p => p.day === i).length;
    h += `<button class="day" type="button" data-day="${i}" aria-pressed="${i===state.day}">Day ${i}<small>${dayLabel(i) || (n ? n + " 項" : "&nbsp;")}</small></button>`;
  }
  $("days").innerHTML = h;
  const items = state.plans.filter(p => p.day === state.day).sort((a,b) => (a.time||"99").localeCompare(b.time||"99") || (a.created||0)-(b.created||0));
  if (state.mode === "loading") { $("planList").innerHTML = LOADING; return; }
  if (!items.length) { $("planList").innerHTML = `<div class="empty">${RYU}Day ${state.day} 還是空白頁，阿龍在等你排行程。<br>按「新增行程」，或到「清單」把口袋名單排進來。</div>`; return; }
  const tapes = ["tape t2","tape t3","tape t4"];
  $("planList").innerHTML = `<ol class="timeline">` + items.map((p,i) => `
    <li class="stop"><time>${esc(p.time || "—")}</time>
      <button class="card sketch ${tapes[i % 3]}" type="button" data-plan="${esc(p.id)}">
        <div class="t">${esc(p.title)}${p.sample ? '<span class="tag">範例</span>' : ""}</div>
        ${p.place ? `<div class="meta">地點・${esc(p.place)}</div>` : ""}
        ${p.note ? `<div class="meta">${esc(p.note)}</div>` : ""}
      </button>
      ${p.place ? `<a class="map" href="${esc(mapUrl(p.place))}" target="_blank" rel="noopener">→ 在 Google 地圖開啟</a>` : ""}
    </li>`).join("") + `</ol>`;
}

function renderTodo(done){
  const n = state.todos.length;
  $("todoBar").style.width = n ? (done / n * 100) + "%" : "0";
  if (!$("todoGroup").options.length) $("todoGroup").innerHTML =
    `<optgroup label="待辦">${TODO_GROUPS.map(g => `<option>${g}</option>`).join("")}</optgroup><optgroup label="口袋名單">${WISH_GROUPS.map(g => `<option>${g}</option>`).join("")}</optgroup>`;
  if (state.mode === "loading") { $("todoList").innerHTML = LOADING; return; }
  if (!n) { $("todoList").innerHTML = `<div class="empty">${RYU}清單是空的。在上方寫下第一件要準備的事。</div>`; return; }
  const groups = [...GROUPS, ...new Set(state.todos.map(t => t.group).filter(g => !GROUPS.includes(g)))];
  const tapes = ["tape","tape t2","tape t3"]; let k = 0;
  $("todoList").innerHTML = groups.map(g => {
    const list = state.todos.filter(t => (t.group || "出發前") === g).sort((a,b) => (a.done - b.done) || (a.created||0)-(b.created||0));
    if (!list.length) return "";
    const wish = WISH_GROUPS.includes(g);
    return `<div class="group"><h3>${wish ? "♡ " : ""}${esc(g)}<span class="num">${list.filter(t=>t.done).length}/${list.length}</span></h3><ul class="todos sketch ${tapes[k++ % 3]}">` +
      list.map(t => `<li class="${t.done ? "done" : ""}"><label><input type="checkbox" data-todo="${esc(t.id)}" ${t.done ? "checked" : ""}><span class="txt">${esc(t.text)}${t.sample ? '<span class="tag">範例</span>' : ""}</span></label>${wish ? `<button class="mini" type="button" data-toplan="${esc(t.id)}">排入行程</button>` : ""}<button class="x" type="button" data-deltodo="${esc(t.id)}" aria-label="刪除 ${esc(t.text)}">×</button></li>`).join("") +
      `</ul></div>`;
  }).join("");
}

function renderMoney(total){
  const T = travelers();
  const per = total / T.length;
  $("moneyStats").innerHTML = `
    <div class="stat sketch tape t4"><span>總花費</span><b>${both(total)}</b></div>
    <div class="stat sketch"><span>每人 (${T.length})</span><b>${both(per)}</b></div>
    <div class="stat sketch"><span>筆數</span><b>${spends().length}</b></div>`;
  if (state.mode === "loading") { $("moneyBody").innerHTML = LOADING; return; }
  if (!state.expenses.length) { $("moneyBody").innerHTML = `<div class="empty">${RYU}還沒有記錄。按「記一筆」輸入金額，日圓或台幣都可以。</div>`; return; }

  let h = "";
  const byCat = {}; for (const e of spends()) byCat[e.cat || "其他"] = (byCat[e.cat || "其他"] || 0) + toJPY(e);
  if (Object.keys(byCat).length) {
    const max = Math.max(...Object.values(byCat));
    h += `<h2>分類</h2><div class="cats">` + Object.entries(byCat).sort((a,b) => b[1]-a[1]).map(([c,v]) =>
      `<div class="cat"><span>${esc(c)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><span class="num">${twd(v * rate())}</span></div>`).join("") + `</div>`;
  }

  if (T.length > 1) {
    // net = what each person has actually put in (payments + transfers sent − transfers received)
    const net = Object.fromEntries(T.map(t => [t, 0]));
    const who = p => p in net ? p : T[0];
    for (const e of state.expenses) {
      const v = toJPY(e);
      if (e.cat === XFER) { net[who(e.payer)] += v; if (e.to in net) net[e.to] -= v; }
      else net[who(e.payer)] += v;
    }
    const bal = T.map(t => [t, net[t] - per]);
    const creditors = bal.filter(b => b[1] > 0.5).map(b => [...b]), debtors = bal.filter(b => b[1] < -0.5).map(b => [b[0], -b[1]]);
    const moves = [];
    for (const d of debtors) for (const c of creditors) {
      const m = Math.min(d[1], c[1]); if (m < 0.5) continue;
      moves.push([d[0], c[0], m]); d[1] -= m; c[1] -= m;
    }
    h += `<h2>分帳（平均分攤）</h2><ul class="settle sketch tape t3">` + T.map(t =>
      `<li><span>${esc(t)} 實付</span><span class="num">${twd(net[t] * rate())}</span></li>`).join("") +
      (moves.length ? moves.map(([a,b,m]) => `<li class="verdict"><span>${esc(a)} → ${esc(b)}</span><span class="num neg">${twd(m * rate())}</span></li>`).join("")
        : `<li class="verdict"><span class="pos">${RYU} 阿龍說：目前已打平！</span></li>`) + `</ul>`;
  }

  h += `<h2>明細</h2>`;
  const dayKeys = [...new Set(state.expenses.map(e => e.day || 0))].sort((a,b) => a - b);
  const ltapes = ["tape t4","tape t2","tape","tape t3"];
  for (const [ki, dk] of dayKeys.entries()) {
    const list = state.expenses.filter(e => (e.day || 0) === dk).sort((a,b) => (a.created||0)-(b.created||0));
    const sum = list.filter(e => e.cat !== XFER).reduce((a,e) => a + toJPY(e), 0);
    h += `<div class="dayhead">${dk ? `Day ${dk} ${dayLabel(dk)}` : "出發前 / 未分日"}・小計 <span class="num">${twd(sum * rate())}</span></div><ul class="ledger sketch ${ltapes[ki % 4]}">` +
      list.map(e => `<li><button type="button" data-exp="${esc(e.id)}">
        <span class="desc"><span class="pill ${e.cat === XFER ? "xfer" : ""}">${esc(e.cat || "其他")}</span>${esc(e.note || "")}${e.sample ? '<span class="tag">範例</span>' : ""}</span>
        <span class="amt">${native(e)}</span>
        <span class="sm">${e.cat === XFER ? `${esc(e.payer)} → ${esc(e.to || "?")}` : `${esc(e.payer || T[0])} 付`}</span>
        <span class="sm" style="text-align:right">${other(e)}</span>
      </button></li>`).join("") + `</ul>`;
  }
  $("moneyBody").innerHTML = h;
}

// ---------- sheets ----------
let sheetSubmit = null;
function openSheet(html, onSubmit){
  $("sheet").innerHTML = `<i class="wt" style="top:-6px;left:24px;transform:rotate(-4deg)"></i>` + html; sheetSubmit = onSubmit; $("scrim").hidden = false;
  const f = $("sheet").querySelector("input:not([type=hidden]),select,textarea"); if (f) setTimeout(() => f.focus(), 30);
}
function closeSheet(){ $("scrim").hidden = true; $("sheet").innerHTML = ""; sheetSubmit = null; }
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeSheet(); });
$("sheet").addEventListener("submit", e => { e.preventDefault(); if (sheetSubmit) sheetSubmit(new FormData($("sheet"))); });
$("sheet").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.close != null) closeSheet();
  if (b.dataset.chip) {
    const g = b.parentElement; g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    g.nextElementSibling.value = b.dataset.chip;
    const to = $("f-to-wrap"); if (to) to.hidden = b.dataset.chip !== XFER;
  }
  if (b.dataset.del != null) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "確定刪除？"; return; }
    const [coll, id] = b.dataset.del.split(":"); delItem(coll, id); closeSheet();
  }
});
function chips(name, options, value){
  return `<div class="chips">${options.map(o => `<button type="button" data-chip="${esc(o)}" aria-pressed="${o===value}">${esc(o)}</button>`).join("")}</div><input type="hidden" name="${name}" value="${esc(value)}">`;
}
function daySelect(value, allowNone){
  let o = allowNone ? `<option value="0" ${!value ? "selected" : ""}>出發前 / 未分日</option>` : "";
  for (let i = 1; i <= numDays(); i++) o += `<option value="${i}" ${i===value ? "selected" : ""}>Day ${i} ${dayLabel(i)}</option>`;
  return `<select name="day" id="f-day">${o}</select>`;
}
function personSelect(name, id, list, value){
  return `<select name="${name}" id="${id}">${[...new Set([...list, value].filter(Boolean))].map(t => `<option ${t===value?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
}
function actions(delKey){
  return `<div class="actions">${delKey ? `<button type="button" class="danger" data-del="${esc(delKey)}">刪除</button>` : "<span></span>"}
    <div class="row"><button type="button" class="ghost" data-close>取消</button><button type="submit" class="primary">儲存</button></div></div>`;
}

function planSheet(p, after){
  p = p || {day: state.day, time:"", title:"", place:"", note:""};
  openSheet(`<h3>${p.id ? "編輯行程" : "新增行程"}</h3>
    <div class="two"><label class="field">日期${daySelect(p.day)}</label>
    <label class="field">時間<input type="time" name="time" id="f-time" value="${esc(p.time)}"></label></div>
    <label class="field">要做什麼<input name="title" id="f-title" required value="${esc(p.title)}" placeholder="例如：一蘭拉麵總本店"></label>
    <label class="field">地點（用來開地圖）<input name="place" id="f-place" value="${esc(p.place)}" placeholder="例如：博多駅"></label>
    <label class="field">備註<textarea name="note" id="f-note" rows="2" placeholder="交通方式、預約編號…">${esc(p.note)}</textarea></label>
    ${actions(p.id && "plans:" + p.id)}`,
  fd => {
    const data = {day:Number(fd.get("day")), time:fd.get("time"), title:fd.get("title").trim(), place:fd.get("place").trim(), note:fd.get("note").trim(), sample:false};
    if (!data.title) return;
    p.id ? updItem("plans", p.id, data) : addItem("plans", data);
    state.day = data.day; closeSheet();
    if (after) after();
  });
}

function expSheet(e){
  const T = travelers();
  const today = (() => { const d1 = dayDate(1); if (!d1) return 0; const t = new Date(); t.setHours(0,0,0,0); const n = Math.round((t - d1)/864e5) + 1; return n >= 1 && n <= numDays() ? n : 0; })();
  e = e || {amount:"", currency:"JPY", cat:"餐飲", payer:T[0], to:T[1] || "", day:today, note:""};
  openSheet(`<h3>${e.id ? "編輯這筆" : "記一筆"}</h3>
    <div class="two"><label class="field">金額<input type="number" inputmode="decimal" min="0" step="any" name="amount" id="f-amount" required value="${esc(e.amount)}"></label>
    <label class="field">幣別<select name="currency" id="f-cur"><option value="JPY" ${e.currency!=="TWD"?"selected":""}>日圓 ¥</option><option value="TWD" ${e.currency==="TWD"?"selected":""}>台幣 NT$</option></select></label></div>
    <div class="field">分類${chips("cat", CATS, e.cat || "其他")}</div>
    <div class="two"><label class="field">誰付的${personSelect("payer","f-payer",T,e.payer)}</label>
    <label class="field" id="f-to-wrap" ${e.cat === XFER ? "" : "hidden"}>轉給誰${personSelect("to","f-to",T,e.to || T.find(t => t !== e.payer))}</label></div>
    <label class="field">哪一天${daySelect(e.day, true)}</label>
    <label class="field">說明<input name="note" id="f-enote" value="${esc(e.note)}" placeholder="例如：一蘭拉麵"></label>
    ${actions(e.id && "expenses:" + e.id)}`,
  fd => {
    const amount = Number(fd.get("amount"));
    if (!(amount > 0)) { toast("請輸入大於 0 的金額"); return; }
    const cat = fd.get("cat");
    const data = {amount, currency:fd.get("currency"), cat, payer:fd.get("payer"), day:Number(fd.get("day")), note:fd.get("note").trim(), sample:false};
    if (cat === XFER) {
      data.to = fd.get("to");
      if (data.to === data.payer) { toast("轉帳的兩個人不能是同一位"); return; }
    }
    e.id ? updItem("expenses", e.id, data) : addItem("expenses", data);
    closeSheet();
  });
}

function settingsSheet(){
  const S = state.settings;
  openSheet(`<h3>旅程設定</h3>
    <label class="field">旅程名稱<input name="name" id="s-name" value="${esc(S.name)}"></label>
    <div class="two"><label class="field">出發日<input type="date" name="start" id="s-start" value="${esc(S.start)}"></label>
    <label class="field">天數<input type="number" min="1" max="30" name="days" id="s-days" value="${esc(S.days)}"></label></div>
    <label class="field">匯率：1 台幣 = ? 日圓<input type="number" step="0.01" min="0" name="jpt" id="s-rate" value="${(1 / rate()).toFixed(2)}"></label>
    <label class="field">旅伴（用逗號分隔，用來分帳）<input name="travelers" id="s-trav" value="${esc((S.travelers||[]).join(", "))}"></label>
    ${actions(null)}`,
  fd => {
    const jpt = Number(fd.get("jpt"));
    saveSettings({
      name: fd.get("name").trim() || "福岡行",
      start: fd.get("start"),
      days: Math.max(1, Math.min(30, Number(fd.get("days")) || 4)),
      rate: jpt > 0 ? 1 / jpt : rate(),
      travelers: fd.get("travelers").split(/[,，、]/).map(s => s.trim()).filter(Boolean)
    });
    closeSheet();
  });
}

// ---------- events ----------
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === tab));
  for (const t of ["plan","todo","money"]) $("panel-" + t).hidden = t !== tab;
  try { localStorage.setItem(LS_KEY + "-tab", tab); } catch {}
  window.scrollTo(0, 0);
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
$("days").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (b) { state.day = Number(b.dataset.day); render(); } });
$("planList").addEventListener("click", e => { const b = e.target.closest("[data-plan]"); if (b) planSheet({...state.plans.find(p => p.id === b.dataset.plan)}); });
$("addPlan").addEventListener("click", () => planSheet());
$("addExp").addEventListener("click", () => expSheet());
$("moneyBody").addEventListener("click", e => { const b = e.target.closest("[data-exp]"); if (b) expSheet({...state.expenses.find(x => x.id === b.dataset.exp)}); });
$("openSettings").addEventListener("click", settingsSheet);
$("todoForm").addEventListener("submit", e => {
  e.preventDefault(); const text = $("todoText").value.trim(); if (!text) return;
  addItem("todos", {group:$("todoGroup").value, text, done:false}); $("todoText").value = ""; $("todoText").focus();
});
$("todoList").addEventListener("change", e => { const c = e.target.closest("[data-todo]"); if (c) updItem("todos", c.dataset.todo, {done:c.checked}); });
$("todoList").addEventListener("click", e => {
  const d = e.target.closest("[data-deltodo]"); if (d) { delItem("todos", d.dataset.deltodo); return; }
  const p = e.target.closest("[data-toplan]");
  if (p) {
    const t = state.todos.find(x => x.id === p.dataset.toplan); if (!t) return;
    planSheet({day:state.day, time:"", title:t.text, place:"", note:""}, () => {
      if (!t.done) updItem("todos", t.id, {done:true});
      setTab("plan"); render(); toast("已排入 Day " + state.day);
    });
  }
});

try { const t = localStorage.getItem(LS_KEY + "-tab"); if (t && t !== "plan") setTab(t); } catch {}

// ---------- boot ----------
render();
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("db").then(d => { if (d) { db = d; startDb(); } else startLocal(); }).catch(startLocal);
} else startLocal();
})();
</script>
